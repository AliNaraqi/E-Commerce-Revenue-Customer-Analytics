<style>
/* ── tokens ──────────────────────────────────────────────────────────────
   Light is the complete set; dark redefines only values, under both the
   media query (OS setting, un-stamped document) and the [data-theme] stamp
   (explicit viewer choice), so either can win.
   Series + surface hexes are the validated dataviz palette, used unchanged
   so its colour-vision-deficiency validation still applies.            */
:root {
  color-scheme: light;
  --page:        #f3f2ee;
  --surface:     #fcfcfb;
  --surface-2:   #f7f6f2;
  --ink:         #0b0b0b;
  --ink-2:       #52514e;
  --muted:       #898781;
  --rule:        #e1e0d9;
  --axis:        #c3c2b7;
  --ring:        rgba(11,11,11,.10);
  --shadow:      0 1px 2px rgba(11,11,11,.05), 0 1px 1px rgba(11,11,11,.04);

  --s1: #2a78d6;  --s2: #eb6834;  --s3: #1baf7a;
  --s1-wash: rgba(42,120,214,.10);
  --good: #0ca30c; --warn: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --critical-wash: rgba(208,59,59,.10);

  --seq-1:#cde2fb; --seq-2:#9ec5f4; --seq-3:#86b6ef; --seq-4:#6da7ec;
  --seq-5:#3987e5; --seq-6:#2a78d6; --seq-7:#256abf; --seq-8:#1c5cab;
  --seq-9:#184f95; --seq-10:#0d366b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --surface-2:#222221;
    --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
    --rule:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10);
    --shadow: 0 1px 2px rgba(0,0,0,.4);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70;
    --s1-wash: rgba(57,135,229,.14);
    --critical:#d03b3b; --critical-wash: rgba(208,59,59,.16);
    --seq-1:#184f95; --seq-2:#1c5cab; --seq-3:#256abf; --seq-4:#2a78d6;
    --seq-5:#3987e5; --seq-6:#5598e7; --seq-7:#6da7ec; --seq-8:#86b6ef;
    --seq-9:#9ec5f4; --seq-10:#cde2fb;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page:#0d0d0d; --surface:#1a1a19; --surface-2:#222221;
  --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
  --rule:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10);
  --shadow: 0 1px 2px rgba(0,0,0,.4);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --s1-wash: rgba(57,135,229,.14);
  --critical:#d03b3b; --critical-wash: rgba(208,59,59,.16);
  --seq-1:#184f95; --seq-2:#1c5cab; --seq-3:#256abf; --seq-4:#2a78d6;
  --seq-5:#3987e5; --seq-6:#5598e7; --seq-7:#6da7ec; --seq-8:#86b6ef;
  --seq-9:#9ec5f4; --seq-10:#cde2fb;
}

* { box-sizing: border-box; }
body {
  background: var(--page);
  color: var(--ink);
  font: 400 14px/1.5 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  margin: 0;
  -webkit-font-smoothing: antialiased;
}
h1,h2,h3 { font-family: Archivo, "IBM Plex Sans", system-ui, sans-serif; margin:0; text-wrap: balance; }
.num { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; }

/* ── header ─────────────────────────────────────────────────────────── */
header {
  position: sticky; top: 0; z-index: 20;
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
}
.hwrap { max-width: 1240px; margin: 0 auto; padding: 16px 22px 0; }
.hrow { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; flex-wrap:wrap; }
h1 { font-size: 19px; font-weight:700; letter-spacing:-.01em; }
.sub { color: var(--ink-2); font-size: 12.5px; margin-top: 3px; }
.chips { display:flex; gap:7px; flex-wrap:wrap; }
.chip {
  font-size: 11px; padding: 4px 9px; border-radius: 3px;
  border: 1px solid var(--ring); color: var(--ink-2); background: var(--surface-2);
  white-space: nowrap;
}
.chip b { color: var(--ink); font-weight:600; }
.chip.warn { border-color: color-mix(in srgb, var(--warn) 45%, transparent); }

/* tabs */
nav { display:flex; gap:2px; margin-top:14px; overflow-x:auto; scrollbar-width:none; }
nav::-webkit-scrollbar { display:none; }
nav button {
  font: 500 13px/1 "IBM Plex Sans", sans-serif;
  background: none; border: 0; border-bottom: 2px solid transparent;
  color: var(--muted); padding: 10px 13px 11px; cursor: pointer; white-space: nowrap;
}
nav button:hover { color: var(--ink); }
nav button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--s1); }
nav button:focus-visible { outline: 2px solid var(--s1); outline-offset: -2px; border-radius:3px; }

/* ── layout ─────────────────────────────────────────────────────────── */
main { max-width: 1240px; margin: 0 auto; padding: 20px 22px 60px; }
.grid { display:grid; grid-template-columns: repeat(12, 1fr); gap: 14px; }
.c12{grid-column:span 12} .c8{grid-column:span 8} .c7{grid-column:span 7}
.c6{grid-column:span 6} .c5{grid-column:span 5} .c4{grid-column:span 4}
@media (max-width: 920px){ .c8,.c7,.c6,.c5,.c4{grid-column:span 12} }

.card {
  background: var(--surface); border: 1px solid var(--rule); border-radius: 6px;
  padding: 15px 16px 13px; min-width: 0;
}
.card > header { position: static; background: none; border: 0; margin-bottom: 12px; }
.ctitle { display:flex; align-items:baseline; gap:9px; flex-wrap:wrap; }
.ctitle h2 { font-size: 14.5px; font-weight: 600; letter-spacing:-.005em; }
.q {
  font: 600 10px/1 "IBM Plex Mono", monospace; color: var(--muted);
  border: 1px solid var(--rule); border-radius: 3px; padding: 3px 5px;
}
.csub { color: var(--ink-2); font-size: 12px; margin-top: 4px; }

/* KPI tiles — the only place big numbers lead */
.kpis { display:grid; grid-template-columns: repeat(6,1fr); gap:10px; }
@media (max-width:1040px){ .kpis{grid-template-columns:repeat(3,1fr)} }
@media (max-width:560px){ .kpis{grid-template-columns:repeat(2,1fr)} }
.kpi { background:var(--surface); border:1px solid var(--rule); border-radius:6px; padding:12px 13px; }
.kpi .lab { font-size:10.5px; letter-spacing:.055em; text-transform:uppercase; color:var(--muted); }
.kpi .val { font-size:22px; font-weight:600; margin-top:5px; letter-spacing:-.02em; }
.kpi .note { font-size:11px; color:var(--ink-2); margin-top:3px; }
.kpi.flag { border-left: 3px solid var(--critical); }
.kpi.flag .val { color: var(--critical); }

/* charts */
.chart { position:relative; }
svg { display:block; width:100%; height:auto; overflow:visible; }
.gl { stroke: var(--rule); stroke-width:1; }
.ax { stroke: var(--axis); stroke-width:1; }
.tk { fill: var(--muted); font: 400 10.5px "IBM Plex Mono", monospace; }
.dl { fill: var(--ink-2); font: 400 10.5px "IBM Plex Mono", monospace; }
.mark { transition: opacity .12s; }
.chart:hover .mark { opacity:.42; }
.chart .mark.hot, .chart:hover .mark.hot { opacity:1; }

.legend { display:flex; gap:14px; flex-wrap:wrap; margin:2px 0 9px; }
.lg { display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-2); }
.sw { width:11px; height:11px; border-radius:2px; flex:none; }

.tip {
  position:absolute; pointer-events:none; opacity:0; transform:translate(-50%,-100%);
  background:var(--ink); color:var(--page); border-radius:4px; padding:7px 9px;
  font-size:11.5px; line-height:1.45; white-space:nowrap; z-index:10;
  transition: opacity .1s; box-shadow: var(--shadow);
}
.tip b { font-family:"IBM Plex Mono",monospace; font-weight:600; }
.tip.on { opacity:1; }

/* tables */
.tbtn {
  font: 500 11px "IBM Plex Sans",sans-serif; background:none; color:var(--muted);
  border:1px solid var(--rule); border-radius:3px; padding:3px 8px; cursor:pointer; margin-left:auto;
}
.tbtn:hover { color:var(--ink); border-color:var(--axis); }
.tbtn:focus-visible { outline:2px solid var(--s1); outline-offset:1px; }
.tw { overflow-x:auto; margin-top:10px; }
table { border-collapse:collapse; width:100%; font-size:12px; }
th,td { text-align:right; padding:6px 9px; border-bottom:1px solid var(--rule); white-space:nowrap; }
th:first-child, td:first-child { text-align:left; }
th { font:600 10.5px/1.3 "IBM Plex Sans",sans-serif; letter-spacing:.04em; text-transform:uppercase;
     color:var(--muted); border-bottom:1px solid var(--axis); }
tbody tr:hover { background: var(--surface-2); }
td.n { font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; }
tr.hl td { background: var(--critical-wash); }
tr.hl td:first-child { font-weight:600; }

.note {
  font-size:12px; color:var(--ink-2); line-height:1.55;
  border-left:2px solid var(--axis); padding:2px 0 2px 11px; margin-top:12px;
}
.note.caution { border-left-color: var(--warn); }
.note b { color: var(--ink); font-weight:600; }
.bignum { font-family:"IBM Plex Mono",monospace; font-weight:600; }

[hidden] { display:none !important; }
@media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>

/* ═══ formatting ═══════════════════════════════════════════════════════ */
const brl = v => v >= 1e6 ? "R$" + (v/1e6).toFixed(2) + "M"
               : v >= 1e3 ? "R$" + Math.round(v/1e3) + "k" : "R$" + v.toFixed(0);
const brlFull = v => "R$" + Math.round(v).toLocaleString("en-US");
const n0 = v => Math.round(v).toLocaleString("en-US");
const pct = (v, d = 1) => v.toFixed(d) + "%";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pretty = s => String(s).replace(/_/g, " ");

/* ═══ chart primitives ═════════════════════════════════════════════════
   Hand-written SVG: every mark, tick and label placed from one scale, so
   no label can name a value the axis doesn't reach. All colour comes from
   CSS custom properties, so both themes resolve from the same token set. */

const SVGNS = "http://www.w3.org/2000/svg";
function el(tag, attrs = {}, parent) {
  const n = document.createElementNS(SVGNS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
function niceMax(v) {
  if (v <= 0) return 1;
  const mag = Math.pow(10, Math.floor(Math.log10(v)));
  return Math.ceil(v / mag * 4) / 4 * mag;
}
/* y gridlines + labels; returns the value->pixel scale */
function yAxis(g, max, h, w, fmt, min = 0, ticks = 5) {
  const y = v => h - (v - min) / (max - min) * h;
  for (let i = 0; i <= ticks; i++) {
    const v = min + (max - min) * i / ticks;
    el("line", { x1: 0, x2: w, y1: y(v), y2: y(v), class: i ? "gl" : "ax" }, g);
    el("text", { x: -9, y: y(v) + 3.5, "text-anchor": "end", class: "tk" }, g).textContent = fmt(v);
  }
  return y;
}
/* shared hover plumbing: one tooltip per chart, positioned off the mark */
function hoverable(wrap, nodes, htmlFor) {
  const tip = document.createElement("div");
  tip.className = "tip";
  wrap.appendChild(tip);
  nodes.forEach(({ node, datum, hot }) => {
    (hot || [node]).forEach(h => h.classList.add("mark"));
    const show = ev => {
      tip.innerHTML = htmlFor(datum);
      tip.classList.add("on");
      const r = wrap.getBoundingClientRect();
      tip.style.left = Math.max(60, Math.min(r.width - 60, ev.clientX - r.left)) + "px";
      tip.style.top = (ev.clientY - r.top - 12) + "px";
      (hot || [node]).forEach(h => h.classList.add("hot"));
    };
    node.addEventListener("pointerenter", show);
    node.addEventListener("pointermove", show);
    node.addEventListener("pointerleave", () => {
      tip.classList.remove("on");
      (hot || [node]).forEach(h => h.classList.remove("hot"));
    });
  });
}
const S = (name) => `var(--${name})`;

/* ── line chart with area wash and an emphasised endpoint ─────────────── */
function lineChart(wrap, rows, { xKey, yKey, yFmt, tip, every = 3, color = "s1",
                                 min = 0, max = null, mark = null, h = 190 }) {
  const w = 760, pad = { l: 56, r: 14, t: 10, b: 26 };
  const iw = w - pad.l - pad.r, ih = h;
  const svg = el("svg", { viewBox: `0 0 ${w} ${h + pad.t + pad.b}`, role: "img" }, wrap);
  const g = el("g", { transform: `translate(${pad.l},${pad.t})` }, svg);
  const hi = max ?? niceMax(Math.max(...rows.map(r => r[yKey])));
  const y = yAxis(g, hi, ih, iw, yFmt, min);
  const x = i => rows.length > 1 ? i / (rows.length - 1) * iw : iw / 2;

  const pts = rows.map((r, i) => [x(i), y(r[yKey])]);
  el("path", {
    d: `M${pts.map(p => p.join(",")).join("L")}L${iw},${ih}L0,${ih}Z`,
    fill: S(color), "fill-opacity": .09
  }, g);
  el("path", {
    d: `M${pts.map(p => p.join(",")).join("L")}`, fill: "none",
    stroke: S(color), "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round"
  }, g);

  if (mark != null) {
    el("circle", { cx: x(mark), cy: y(rows[mark][yKey]), r: 5,
                   fill: S("critical"), stroke: S("surface"), "stroke-width": 2 }, g);
  }
  const last = rows.length - 1;
  el("circle", { cx: x(last), cy: y(rows[last][yKey]), r: 4.5,
                 fill: S(color), stroke: S("surface"), "stroke-width": 2 }, g);

  // Label every nth point, plus the last — but only if the last is far enough
  // from the previous label to not collide with it.
  const lastLabelled = Math.floor(last / every) * every;
  rows.forEach((r, i) => {
    if (i % every === 0 || (i === last && last - lastLabelled >= 2))
      el("text", { x: x(i), y: ih + 17, "text-anchor": "middle", class: "tk" }, g)
        .textContent = r[xKey];
  });

  const nodes = rows.map((r, i) => {
    const dot = el("circle", { cx: x(i), cy: y(r[yKey]), r: 11, fill: "transparent" }, g);
    const vis = el("circle", { cx: x(i), cy: y(r[yKey]), r: 3.5, fill: S(color),
                               opacity: 0, "pointer-events": "none" }, g);
    dot.addEventListener("pointerenter", () => vis.setAttribute("opacity", 1));
    dot.addEventListener("pointerleave", () => vis.setAttribute("opacity", 0));
    return { node: dot, datum: r, hot: [] };
  });
  hoverable(wrap, nodes, tip);
}

/* ── vertical bars, optionally grouped (max 2 series) ─────────────────── */
function barChart(wrap, rows, { xKey, series, yFmt, tip, h = 190, every = 1,
                                colorFor = null, xRot = 0, labels = false }) {
  const w = 760, pad = { l: 56, r: 14, t: 12, b: xRot ? 58 : 28 };
  const iw = w - pad.l - pad.r, ih = h;
  const svg = el("svg", { viewBox: `0 0 ${w} ${h + pad.t + pad.b}`, role: "img" }, wrap);
  const g = el("g", { transform: `translate(${pad.l},${pad.t})` }, svg);
  const hi = niceMax(Math.max(...rows.flatMap(r => series.map(s => r[s.key]))));
  const y = yAxis(g, hi, ih, iw, yFmt);
  const step = iw / rows.length, bw = Math.min(34, step * .66 / series.length);

  const nodes = [];
  rows.forEach((r, i) => {
    const cx = step * (i + .5);
    const hots = [];
    series.forEach((s, si) => {
      const off = (si - (series.length - 1) / 2) * (bw + 2);
      const v = r[s.key], top = y(v);
      const b = el("rect", {
        x: cx + off - bw / 2, y: top, width: bw, height: Math.max(1, ih - top),
        fill: colorFor ? S(colorFor(r, s)) : S(s.color), rx: 2
      }, g);
      hots.push(b);
      if (labels && series.length === 1)
        el("text", { x: cx, y: top - 5, "text-anchor": "middle", class: "dl" }, g)
          .textContent = yFmt(v, true);
    });
    const hit = el("rect", { x: cx - step / 2, y: 0, width: step, height: ih, fill: "transparent" }, g);
    nodes.push({ node: hit, datum: r, hot: hots });
    if (i % every === 0) {
      const tx = el("text", { x: cx, y: ih + 16, class: "tk",
        "text-anchor": xRot ? "end" : "middle" }, g);
      tx.textContent = r[xKey];
      if (xRot) tx.setAttribute("transform", `rotate(-${xRot} ${cx} ${ih + 16})`);
    }
  });
  hoverable(wrap, nodes, tip);
}

/* ── stacked bars with a 2px surface gap between segments ─────────────── */
function stackChart(wrap, rows, { xKey, series, yFmt, tip, h = 190, every = 3 }) {
  const w = 760, pad = { l: 56, r: 14, t: 12, b: 28 };
  const iw = w - pad.l - pad.r, ih = h;
  const svg = el("svg", { viewBox: `0 0 ${w} ${h + pad.t + pad.b}`, role: "img" }, wrap);
  const g = el("g", { transform: `translate(${pad.l},${pad.t})` }, svg);
  const hi = niceMax(Math.max(...rows.map(r => series.reduce((a, s) => a + r[s.key], 0))));
  const y = yAxis(g, hi, ih, iw, yFmt);
  const step = iw / rows.length, bw = Math.min(30, step * .64);

  const nodes = [];
  rows.forEach((r, i) => {
    const cx = step * (i + .5);
    let acc = 0; const hots = [];
    series.forEach(s => {
      const v = r[s.key], y0 = y(acc), y1 = y(acc + v);
      hots.push(el("rect", { x: cx - bw / 2, y: y1, width: bw,
        height: Math.max(1, y0 - y1 - (acc ? 2 : 0)), fill: S(s.color), rx: 1.5 }, g));
      acc += v;
    });
    nodes.push({ node: el("rect", { x: cx - step / 2, y: 0, width: step, height: ih,
      fill: "transparent" }, g), datum: r, hot: hots });
    if (i % every === 0)
      el("text", { x: cx, y: ih + 16, "text-anchor": "middle", class: "tk" }, g)
        .textContent = r[xKey];
  });
  hoverable(wrap, nodes, tip);
}

/* ── horizontal bars, label outside the bar end ───────────────────────── */
function hBarChart(wrap, rows, { yKey, xKey, xFmt, tip, colorFor = null,
                                 rowH = 22, labelW = 150 }) {
  const w = 760, pad = { l: labelW, r: 96, t: 4, b: 20 };
  const iw = w - pad.l - pad.r, ih = rows.length * rowH;
  const svg = el("svg", { viewBox: `0 0 ${w} ${ih + pad.t + pad.b}`, role: "img" }, wrap);
  const g = el("g", { transform: `translate(${pad.l},${pad.t})` }, svg);
  const hi = niceMax(Math.max(...rows.map(r => r[xKey])));
  const x = v => v / hi * iw;

  for (let i = 0; i <= 4; i++) {
    const v = hi * i / 4;
    el("line", { x1: x(v), x2: x(v), y1: 0, y2: ih, class: i ? "gl" : "ax" }, g);
    el("text", { x: x(v), y: ih + 14, "text-anchor": "middle", class: "tk" }, g)
      .textContent = xFmt(v, true);
  }
  const bh = Math.min(15, rowH - 7);
  const nodes = rows.map((r, i) => {
    const cy = i * rowH + rowH / 2;
    const bar = el("rect", { x: 0, y: cy - bh / 2, width: Math.max(1, x(r[xKey])),
      height: bh, fill: S(colorFor ? colorFor(r) : "s1"), rx: 2 }, g);
    el("text", { x: -10, y: cy + 3.8, "text-anchor": "end", class: "dl" }, g)
      .textContent = pretty(r[yKey]);
    el("text", { x: x(r[xKey]) + 8, y: cy + 3.8, class: "tk" }, g)
      .textContent = xFmt(r[xKey]);
    const hit = el("rect", { x: -pad.l, y: cy - rowH / 2, width: w, height: rowH,
      fill: "transparent" }, g);
    return { node: hit, datum: r, hot: [bar] };
  });
  hoverable(wrap, nodes, tip);
}

/* ── diverging bars around a zero baseline ────────────────────────────── */
function divergingChart(wrap, rows, { xKey, yKey, yFmt, tip, h = 200, xRot = 34 }) {
  const w = 760, pad = { l: 56, r: 14, t: 18, b: 74 };
  const iw = w - pad.l - pad.r, ih = h;
  const svg = el("svg", { viewBox: `0 0 ${w} ${h + pad.t + pad.b}`, role: "img" }, wrap);
  const g = el("g", { transform: `translate(${pad.l},${pad.t})` }, svg);
  const vals = rows.map(r => r[yKey]);
  const hi = Math.max(...vals, 0.5), lo = Math.min(...vals, 0);
  const span = hi - lo;
  const y = v => ih - (v - lo) / span * ih;
  for (let i = 0; i <= 4; i++) {
    const v = lo + span * i / 4;
    el("line", { x1: 0, x2: iw, y1: y(v), y2: y(v), class: "gl" }, g);
    el("text", { x: -9, y: y(v) + 3.5, "text-anchor": "end", class: "tk" }, g)
      .textContent = v.toFixed(1);
  }
  el("line", { x1: 0, x2: iw, y1: y(0), y2: y(0), class: "ax" }, g);
  const step = iw / rows.length, bw = Math.min(40, step * .62);

  const nodes = rows.map((r, i) => {
    const cx = step * (i + .5), v = r[yKey];
    const bar = el("rect", {
      x: cx - bw / 2, y: Math.min(y(v), y(0)), width: bw,
      height: Math.max(1, Math.abs(y(v) - y(0))),
      fill: S(v >= 0 ? "s1" : "critical"), rx: 2,
      opacity: v === 0 ? 0 : 1
    }, g);
    // Value label always sits on the OUTER side of the bar, away from the
    // baseline, so it never lands on the rotated category labels below.
    el("text", { x: cx, y: v >= 0 ? y(v) - 7 : y(v) + 13, "text-anchor": "middle", class: "dl" }, g)
      .textContent = v === 0 ? "ref" : (v > 0 ? "+" : "") + v.toFixed(2);
    const ty = ih + 15;
    const tx = el("text", { x: cx, y: ty, class: "tk", "text-anchor": "end" }, g);
    tx.textContent = r[xKey];
    tx.setAttribute("transform", `rotate(-${xRot} ${cx} ${ty})`);
    const hit = el("rect", { x: cx - step / 2, y: 0, width: step, height: ih,
      fill: "transparent" }, g);
    return { node: hit, datum: r, hot: [bar] };
  });
  hoverable(wrap, nodes, tip);
}

/* ═══ card scaffolding ═════════════════════════════════════════════════ */
function card(span, q, title, sub, legend) {
  const d = document.createElement("div");
  d.className = "card " + span;
  d.innerHTML = `<header>
      <div class="ctitle">${q ? `<span class="q">${q}</span>` : ""}<h2>${title}</h2></div>
      ${sub ? `<div class="csub">${sub}</div>` : ""}
    </header>
    ${legend ? `<div class="legend">${legend.map(l =>
      `<span class="lg"><span class="sw" style="background:var(--${l.c})"></span>${esc(l.t)}</span>`
    ).join("")}</div>` : ""}
    <div class="chart"></div>`;
  return d;
}
const legendHTML = items => items.map(l =>
  `<span class="lg"><span class="sw" style="background:var(--${l.c})"></span>${esc(l.t)}</span>`).join("");

/* Accessibility: every chart ships a table view of the same numbers. */
function withTable(cardEl, cols, rows) {
  const head = cardEl.querySelector(".ctitle");
  const btn = document.createElement("button");
  btn.className = "tbtn"; btn.textContent = "Table"; btn.setAttribute("aria-expanded", "false");
  head.appendChild(btn);
  const tw = document.createElement("div");
  tw.className = "tw"; tw.hidden = true;
  tw.innerHTML = `<table><thead><tr>${cols.map(c => `<th>${esc(c.h)}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(r => `<tr>${cols.map((c, i) =>
      `<td${i ? ' class="n"' : ""}>${esc(c.f(r))}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
  cardEl.appendChild(tw);
  btn.onclick = () => {
    tw.hidden = !tw.hidden;
    btn.setAttribute("aria-expanded", String(!tw.hidden));
    btn.textContent = tw.hidden ? "Table" : "Hide table";
  };
  return cardEl;
}
function kpi(lab, val, note, flag) {
  return `<div class="kpi${flag ? " flag" : ""}"><div class="lab">${esc(lab)}</div>
    <div class="val num">${esc(val)}</div><div class="note">${note || ""}</div></div>`;
}
function plainTable(cardEl, cols, rows, hlFn) {
  const tw = document.createElement("div");
  tw.className = "tw";
  tw.innerHTML = `<table><thead><tr>${cols.map(c => `<th>${esc(c.h)}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(r => `<tr${hlFn && hlFn(r) ? ' class="hl"' : ""}>${cols.map((c, i) =>
      `<td${i ? ' class="n"' : ""}>${esc(c.f(r))}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
  cardEl.appendChild(tw);
  return cardEl;
}

    "Order assigned to the category holding most of its item value. 500+ orders.");
  plainTable(c5, [
    { h: "Category", f: r => pretty(r.category) }, { h: "Orders", f: r => n0(r.delivered_orders) },
    { h: "Late %", f: r => r.late_pct + "%" }, { h: "Days", f: r => r.avg_days_to_deliver },
    { h: "Review", f: r => r.avg_review.toFixed(2) }
  ], D.delaysCategory, r => r.category === "office_furniture");
  c5.insertAdjacentHTML("beforeend",
    `<div class="note">Category spread is narrow (4%–8%), so lateness is a <b>geography and
     carrier</b> problem, not a product one. The outlier is <b>office furniture</b>: 20.7 days
     against a 12.6-day mean, and the lowest review score in the table.</div>`);
  f.appendChild(c5);
  return f;
};

PAGES.evidence = () => {
  const f = document.createDocumentFragment();
  const c = D.controls;

  const intro = document.createElement("div");
  intro.className = "card c12";
  intro.innerHTML = `<header><div class="ctitle"><h2>Two claims that description alone could not settle</h2></div>
    <div class="csub">Both findings were first reported with caveats instead of evidence. This tab
    is the test of each — including one that corrected the original wording.</div></header>
    <div class="note caution"><b>These tests are observational.</b> Controls remove <i>observed</i>
    confounders; they cannot rule out an unobserved one. Reverse causation is implausible here —
    a review cannot retro-date a delivery — which is why the delivery result is reported as a
    robust association rather than merely suggestive. It is still not a randomised effect estimate.</div>`;
  f.appendChild(intro);

  const c1 = card("c7", "Claim 1", "Is Rio de Janeiro slow because it is far?",
    "Average delivery days by seller-to-customer distance band, computed from zip-prefix centroids in the geolocation table.");
  c1.querySelector("header").insertAdjacentHTML("beforeend",
    `<div class="legend">${legendHTML([{ c: "s1", t: "all other states" }, { c: "s2", t: "Rio de Janeiro" }])}</div>`);
  const bands = [...new Set(D.rjBands.map(r => r.band))];
  const bandRows = bands.map(b => {
    const rjr = D.rjBands.find(r => r.band === b && r.is_rj === "RJ") || {};
    const otr = D.rjBands.find(r => r.band === b && r.is_rj === "all other states") || {};
    return { band: b, rj_days: rjr.avg_days ?? 0, other_days: otr.avg_days ?? 0,
             rj_late: rjr.late_pct ?? 0, other_late: otr.late_pct ?? 0,
             rj_n: rjr.orders ?? 0, other_n: otr.orders ?? 0 };
  });
  barChart(c1.querySelector(".chart"), bandRows, {
    xKey: "band", xRot: 26, h: 200,
    series: [{ key: "other_days", color: "s1" }, { key: "rj_days", color: "s2" }],
    yFmt: v => v.toFixed(0),
    tip: r => `<b>${r.band}</b><br>other states <b>${r.other_days}</b> days `
            + `(${r.other_late}% late)<br>Rio de Janeiro <b>${r.rj_days}</b> days `
            + `(${r.rj_late}% late)<br><span style="opacity:.7">RJ n=${n0(r.rj_n)}</span>`
  });
  c1.insertAdjacentHTML("beforeend",
    `<div class="note"><b>The original claim was wrong in its wording and right in its
     conclusion.</b> RJ orders average <b class="bignum">${c.claim_1_rj_distance.rj_avg_km.toFixed(0)}km</b>
     against São Paulo's <b class="bignum">${c.claim_1_rj_distance.sp_avg_km.toFixed(0)}km</b> — RJ
     genuinely <i>is</i> further, so "comparable distances" was false. Banding by distance instead:
     RJ matches the national field under 100km (<b>6.6 vs 6.5</b> days) and falls behind from
     100km out. <i>In the 1000km+ bands RJ is faster, but those hold under 700 RJ orders between
     them; 88% of RJ volume sits in the 100–1000km range where RJ trails.</i></div>`);
  f.appendChild(c1);

  const c2 = card("c5", "Claim 1", "Same sellers, same distance, different destination",
    "São Paulo sellers only — holding origin constant as well as distance. RJ against Minas Gerais.");
  c2.querySelector("header").insertAdjacentHTML("beforeend",
    `<div class="legend">${legendHTML([{ c: "s1", t: "Minas Gerais" }, { c: "s2", t: "Rio de Janeiro" }])}</div>`);
  const mgBands = [...new Set(D.rjMg.map(r => r.band))].map(b => {
    const r1 = D.rjMg.find(r => r.band === b && r.customer_state === "MG") || {};
    const r2 = D.rjMg.find(r => r.band === b && r.customer_state === "RJ") || {};
    return { band: b, mg: r1.avg_days ?? 0, rj: r2.avg_days ?? 0,
             mg_late: r1.late_pct ?? 0, rj_late: r2.late_pct ?? 0 };
  });
  barChart(c2.querySelector(".chart"), mgBands, {
    xKey: "band", h: 200, series: [{ key: "mg", color: "s1" }, { key: "rj", color: "s2" }],
    yFmt: v => v.toFixed(0),
    tip: r => `<b>${r.band}</b><br>Minas Gerais <b>${r.mg}</b> days (${r.mg_late}% late)<br>`
            + `Rio de Janeiro <b>${r.rj}</b> days (${r.rj_late}% late)`
  });
  c2.insertAdjacentHTML("beforeend",
    `<div class="note">At 300–600km from the same São Paulo sellers, RJ takes
     <b class="bignum">${c.claim_1_rj_distance.rj_days_300_600}</b> days at a
     <b>${c.claim_1_rj_distance.rj_late_pct_300_600}%</b> late rate, against MG's
     <b class="bignum">${c.claim_1_rj_distance.mg_days_300_600}</b> days and
     <b>${c.claim_1_rj_distance.mg_late_pct_300_600}%</b>. A <b>destination-side</b> problem —
     line-haul or regional carrier handoff — not geography and not seller mix.</div>`);
  f.appendChild(c2);

  const c3 = card("c7", "Claim 2", "The review gap barely moves under any control",
    "Review-score difference between on-time and late orders, under progressively stricter adjustment.");
  hBarChart(c3.querySelector(".chart"), D.gapControls, {
    yKey: "adjustment", xKey: "gap", labelW: 268, rowH: 26,
    xFmt: v => v.toFixed(2),
    colorFor: r => r.adjustment.includes("seller fixed") ? "s3" : "s1",
    tip: r => `<b>${r.adjustment}</b><br>gap <b>${r.gap}</b> points<br>`
            + (r.strata ? `${n0(r.strata)} strata · ` : "") + `${n0(r.orders)} orders`
  });
  c3.insertAdjacentHTML("beforeend",
    `<div class="note">The strictest test compares <b>the same seller's</b> on-time and late
     orders, within the same state, category and month, at similar price and distance:
     <b class="bignum">−${c.claim_2_review_gap.gap_within_seller}</b> points
     (95% CI −${c.claim_2_review_gap.gap_within_seller_ci[1]} to
     −${c.claim_2_review_gap.gap_within_seller_ci[0]}), across
     <b>${n0(c.claim_2_review_gap.gap_within_seller_n)}</b> orders from
     <b>${c.claim_2_review_gap.sellers_in_fe}</b> sellers. Geography, product mix and seller
     quality do <b>not</b> explain the gap.</div>`);
  f.appendChild(c3);

  const c4 = card("c5", "Claim 2", "Earliness buys +0.12; one week late costs −1.28",
    "Adjusted effect on review score versus delivery on the estimated day, with all controls and seller fixed effects.");
  divergingChart(c4.querySelector(".chart"), D.doseResponse, {
    xKey: "bucket", yKey: "adjusted_effect", h: 190,
    tip: r => `<b>${r.bucket}</b><br>adjusted effect <b>${r.adjusted_effect > 0 ? "+" : ""}`
            + `${r.adjusted_effect}</b><br>${n0(r.orders)} orders`
  });
  c4.insertAdjacentHTML("beforeend",
    `<div class="note">Roughly a <b class="bignum">10:1</b> asymmetry. Padding delivery
     estimates protects against the penalty; it does not itself generate satisfaction.</div>`);
  f.appendChild(c4);

  const c5 = card("c12", null, "What this evidence does and does not support", null);
  c5.querySelector(".chart").remove();
  plainTable(c5, [
    { h: "Claim", f: r => r[0] }, { h: "Status", f: r => r[1] }, { h: "Evidence", f: r => r[2] }
  ], [
    ["RJ delays are not explained by distance", "Supported, wording corrected",
     "Within-band and same-origin comparisons; RJ is further than SP, but still 4–5 days slower at equal distance"],
    ["Late delivery associates with ~2 fewer stars", "Supported, robust",
     "−1.93 within-seller (95% CI −1.97 to −1.89), n=59,841"],
    ["Late delivery causes lower scores", "Not established",
     "Observational; no randomisation, unobserved confounders possible"],
    ["Fixing lateness would add ~2 stars", "Not established",
     "A controlled association is not an effect estimate"],
    ["Repeat rate is 3%", "Lower bound only",
     "~21-month window censors customers acquired late in the period"]
  ]);
  f.appendChild(c5);
  return f;
};

/* ═══ routing ══════════════════════════════════════════════════════════ */
const app = document.getElementById("app");
function render(p) {
  app.innerHTML = "";
  const g = document.createElement("div");
  g.className = "grid";
  g.appendChild(PAGES[p]());
  app.appendChild(g);
  window.scrollTo({ top: 0, behavior: "instant" });
}
document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-p]");
  if (!b) return;
  [...e.currentTarget.children].forEach(x => x.setAttribute("aria-selected", String(x === b)));
  render(b.dataset.p);
});
render("overview");
</script>
